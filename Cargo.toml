[workspace]
members = [ "gateway-api-inference-extension"]
resolver = "2"

[workspace.package]
authors = ["Dawid Nowak <nowakd@gmail.com>"]
edition = "2024"
license = "MIT"
version = "1.1.0"
readme = "./README.md"
repository = "https://github.com/kubvernor/gateway-api-inference-extension-rs"

[workspace.dependencies]
kube = { version = "3.0.0", default-features = false }
k8s-openapi = { version = "0.27.0" }
schemars = "1.2.0"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }

